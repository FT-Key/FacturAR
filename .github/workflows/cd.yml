name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  publish-images:
    name: Publicar imágenes en Docker Hub
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout del commit validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verificar secretos de Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Configurá DOCKERHUB_USERNAME y DOCKERHUB_TOKEN en los secretos del repositorio."
            exit 1
          fi

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: facturAR_backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/facturar-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/facturar-api:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build y push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: facturAR_frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/facturar-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/facturar-web:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Validar nombre de rama
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validar convención
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "development" ]]; then
            echo "Rama de promoción '$BRANCH_NAME'; validación de nombre omitida."
            exit 0
          fi
          pattern='^(feature|fix|hotfix)/us-[0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*$|^(chore|docs|refactor|test|perf|ci|build)/[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$BRANCH_NAME" =~ $pattern ]]; then
            echo "::error::Rama '$BRANCH_NAME' inválida. Usar feature/us-XX-slug, fix/us-XX-slug o una rama auxiliar chore/docs/refactor/test/perf/ci/build con slug en minúsculas."
            exit 1
          fi

  build-test:
    name: Build y tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGO_CONNECTION_STRING: mongodb://localhost:27017/?directConnection=true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Levantar MongoDB como replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.2 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          for i in $(seq 1 30); do
            if [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ]; then
              echo "Replica set listo"
              exit 0
            fi
            sleep 2
          done
          echo "::error::MongoDB no quedó como primario del replica set"
          exit 1

      - name: Cache de NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurar
        run: dotnet restore FacturAR.slnx

      - name: Compilar
        run: dotnet build FacturAR.slnx -c Release --no-restore

      - name: Verificar formato y analizadores
        run: dotnet format FacturAR.slnx --verify-no-changes --verbosity minimal

      - name: Ejecutar tests
        run: dotnet test FacturAR.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  build-images:
    name: Construir imágenes Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir la imagen de la API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: facturAR_backend/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            APP_VERSION=0.1.0
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Construir la imagen del portal
        uses: docker/build-push-action@v6
        with:
          context: .
          file: facturAR_frontend/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            APP_VERSION=0.1.0
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

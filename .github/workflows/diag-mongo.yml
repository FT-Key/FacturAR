name: Diagnóstico MongoDB

on:
  push:
    branches: [fix/us-20-mongo-kernel-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: Diagnóstico MongoDB
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Diagnosticar arranque de MongoDB
        run: |
          set +e
          echo "::notice::kernel=$(uname -r) image_os=$ImageOS image_version=$ImageVersion"
          for img in mongo:8 mongo:8.2 mongo:7.0; do
            echo "::notice::probando $img"
            pull_log="/tmp/pull-${img//[:\/]/_}.log"
            run_log="/tmp/run-${img//[:\/]/_}.log"
            if ! docker pull "$img" > "$pull_log" 2>&1; then
              echo "::error::[$img] pull fallo"
              tail -n 5 "$pull_log" | while IFS= read -r line; do echo "::error::[$img] $line"; done
              continue
            fi
            timeout 25 docker run --rm --name diag-mongo "$img" mongod --quiet --dbpath /tmp/db > "$run_log" 2>&1
            echo "::error::[$img] salida de mongod"
            head -n 12 "$run_log" | while IFS= read -r line; do echo "::error::[$img] $line"; done
          done

name: facturar-dev

services:
  api:
    build:
      context: .
      dockerfile: facturAR_backend/Dockerfile
    image: facturar-api:dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Mongo__ConnectionString: ${MONGO_CONNECTION_STRING:-mongodb://host.docker.internal:27017/?serverSelectionTimeoutMS=3000}
      Mongo__DatabaseName: ${MONGO_DATABASE:-facturar_dev}
      Mongo__InitializeIndexes: ${MONGO_INITIALIZE_INDEXES:-true}
      Email__Provider: ${EMAIL_PROVIDER:-File}
      Email__From: ${EMAIL_FROM:-facturar@localhost}
      Email__FromName: ${EMAIL_FROM_NAME:-FacturAR}
      Email__DirectorioSalida: ${EMAIL_DIRECTORIO_SALIDA:-emails}
      Portal__BaseUrl: ${PORTAL_BASEURL:-http://localhost:8081}
      Admin__NotificationEmail: ${ADMIN_NOTIFICATION_EMAIL:-}
    volumes:
      - emails-dev:/app/emails
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: facturAR_frontend/Dockerfile
    image: facturar-web:dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Api__BaseUrl: http://api:8080
    ports:
      - "8081:8080"
    depends_on:
      - api

  mongo:
    image: mongo:8.2
    profiles: ["mongo-local"]
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  emails-dev:
  mongo-dev:
